# Workflow de integración continua.
# En cada PR (y push a main) instala dependencias con Yarn y compila el proyecto
# (typecheck + build de producción) para validar que todo sigue verde.
name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Habilitar Yarn (Corepack)
              run: corepack enable
            - run: yarn install --immutable
            - run: yarn build
