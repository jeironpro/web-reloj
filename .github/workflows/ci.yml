name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Habilitar Yarn (Corepack)
              run: corepack enable
            - run: yarn install --immutable
            - run: yarn build
