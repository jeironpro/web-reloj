# Workflow de integración continua.
# En cada PR (y push a main) valida, en orden:
#   1. Lint (ESLint): calidad, imports y tipos.
#   2. Formato (Prettier): indentación de 4 espacios y demás convenciones.
#   3. Build: typecheck + build de producción.
name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Habilitar Yarn (Corepack)
              run: corepack enable
            - run: yarn install --immutable
            - name: Lint (ESLint)
              run: yarn lint
            - name: Formato (Prettier)
              run: yarn format:check
            - name: Build
              run: yarn build
